<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --floor:#121316; --iron:#1a1b1f; --iron-2:#23252a; --iron-3:#2f3137; --line:#44474f;
  --chalk:#eeebe4; --chalk-2:#b8b4ab; --chalk-3:#817e77;
  --steel:#8a8f96; --steel-hi:#aeb2b8;
  --red:#e2452f; --blue:#3d7de3; --yellow:#f2c230; --green:#34aa67; --plate-white:#d9d5cc;
  --ink:#121316; --dot:#9a968d; --water:#4cb6dc; --sleep:#8f7ff0;
  --display:"Big Shoulders Display","Oswald",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --hanzi:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
html,body{background:var(--floor);color:var(--chalk)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.3;cursor:default}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
input,textarea{font:inherit;font-size:16px;color:var(--chalk);background:var(--iron-2);border:1px solid var(--iron-3);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:var(--chalk-3)}
input:focus,textarea:focus{outline:none;border-color:var(--chalk-3)}
textarea{resize:vertical}
h1,h2,h3,p{margin:0}

.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:12px 8px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk-3)}
.brand b{color:var(--chalk);font-weight:700}
#sync{letter-spacing:.06em;font-weight:500}
#sync.bad{color:var(--yellow)}
#view{display:flex;flex-direction:column;gap:14px}

.eyebrow,.lbl{font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-3)}
.datebar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.date-mid{text-align:center}
h1{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.nav-btn{width:44px;height:44px;border-radius:12px;background:var(--iron);display:grid;place-items:center}
.nav-btn svg{width:20px;height:20px}
.link{font-family:var(--label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--yellow);align-self:center}
.page-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h .sub{font-family:var(--label);font-size:15px;color:var(--chalk-2);letter-spacing:.04em}

.hero{display:flex;flex-direction:column;gap:10px;padding-block:6px 2px}
.hero svg{width:100%;height:auto;display:block}
.pl{transition:opacity .25s}
.hero-row{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:12px}
.score b{font-family:var(--display);font-weight:900;font-size:64px;line-height:.85;font-variant-numeric:tabular-nums}
.score span{font-family:var(--display);font-weight:700;font-size:22px;color:var(--chalk-3);margin-left:2px}
.verdict{font-family:var(--label);font-size:15px;line-height:1.25;color:var(--chalk-2);letter-spacing:.03em;padding-bottom:4px}
.verdict .won{color:var(--red);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:17px}
.streak{text-align:right;padding-bottom:2px}
.streak b{display:block;font-family:var(--display);font-weight:900;font-size:40px;line-height:.9;color:var(--red);font-variant-numeric:tabular-nums}
.streak span{font-family:var(--label);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-3)}
.rule{font-size:13.5px;color:var(--chalk-3)}

.card{background:var(--iron);border:1px solid var(--iron-3);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;--c:var(--chalk)}
.ch{display:flex;align-items:center;gap:10px}
.plate-ic{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);position:relative;box-shadow:inset 0 0 0 4px rgba(0,0,0,.18)}
.plate-ic::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--iron)}
h2{font-family:var(--display);font-weight:800;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.015em}
.st{margin-left:auto;font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-3);white-space:nowrap}
.st.done{color:var(--c)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:11px 4px;border-radius:10px;background:var(--iron-2);font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk-2)}
.seg button.on{background:var(--c);color:var(--ink)}
.seg button.bad.on{background:transparent;box-shadow:inset 0 0 0 1.5px var(--red);color:var(--red)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;background:var(--iron-2);font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--chalk-2);font-variant-numeric:tabular-nums}
.chip.on{background:var(--c);color:var(--ink)}
.chip.minus{color:var(--chalk-3)}

.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.count b{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-family:var(--label);font-size:15px;color:var(--chalk-3);margin-left:4px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.prog{height:6px;background:var(--iron-3);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:3px;transition:width .3s}

.toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--iron-2);font-weight:500;text-align:left}
.toggle .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--chalk-3);display:grid;place-items:center;flex:none}
.toggle.on .box{background:var(--c);border-color:var(--c)}
.toggle.on .box::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateY(-1px) rotate(-45deg)}

.go{align-self:flex-start;font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > span{font-size:13.5px;color:var(--chalk-2)}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.grid-word{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-word .hz-in{grid-column:1 / -1;font-family:var(--hanzi);font-size:22px}
.hint{font-size:14px;color:var(--chalk-2);min-height:1.45em}
.primary{padding:12px;border-radius:10px;background:var(--c);color:var(--ink);font-family:var(--label);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase}

.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;border-top:1px solid var(--iron-3)}
.qrow:first-of-type{border-top:0;padding-top:0}
.qname{display:flex;flex-direction:column;min-width:0}
.qname b{font-weight:600;overflow-wrap:anywhere}
.qname span{font-family:var(--label);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-3)}
.qbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mini{padding:8px 12px;border-radius:8px;background:var(--iron-2);font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--chalk-2);white-space:nowrap}
.mini.on{background:var(--c);color:var(--ink)}
.mini.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--iron-3);color:var(--chalk-3)}
.mini.danger{background:var(--red);color:#fff}
.slip-tag{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}

.lvl{display:flex;flex-direction:column;gap:6px}
.lvl-top{display:flex;align-items:center;gap:10px}
.lvl-badge{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.12em;background:var(--chalk);color:var(--ink);padding:3px 8px;border-radius:6px;white-space:nowrap}
.lvl-badge b{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:0;margin-left:2px}
.lvl-title{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.lvl-today{margin-left:auto;font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--chalk);white-space:nowrap;font-variant-numeric:tabular-nums}
.lvl-today.neg{color:var(--red)}
.xpbar{height:8px;border-radius:4px;background:var(--iron-3);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:4px;background:var(--chalk);transition:width .4s}
.lvl-sub{font-size:13px;color:var(--chalk-3);font-variant-numeric:tabular-nums}
.ranks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rank{border-radius:10px;background:var(--iron-2);padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rank span{font-family:var(--label);font-size:12px;letter-spacing:.1em;color:var(--chalk-3)}
.rank b{font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.rank.got{color:var(--chalk)}
.rank:not(.got) b{color:var(--chalk-3)}
.rank.cur{background:var(--chalk);color:var(--ink)}
.rank.cur span,.rank.cur b{color:var(--ink)}
.xp-pos{color:var(--chalk)} .xp-neg{color:var(--red)}
.pbars{display:flex;flex-direction:column;gap:10px}
.pbar{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px}
.pbar span{font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk-2)}
.pbar b{font-family:var(--display);font-weight:800;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.tile b small{font-size:18px;color:var(--chalk-3);font-weight:700}
.focus{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;text-transform:uppercase;text-wrap:balance}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head .nav-btn{width:36px;height:36px;border-radius:10px;background:var(--iron-2)}
.cal-head .nav-btn svg{width:16px;height:16px}
.cal-title{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--chalk-3);text-align:center;padding-bottom:2px}
.cal-d{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--iron-2);font-family:var(--label);font-weight:600;font-size:14px;color:var(--chalk-3);display:flex;align-items:center;justify-content:center;position:relative;font-variant-numeric:tabular-nums}
.cal-d.clean{background:var(--plate-white);color:var(--ink)}
.cal-d.part{background:rgba(217,213,204,.26);color:var(--chalk)}
.cal-d.slip{background:var(--red);color:#fff}
.cal-d.fut{background:transparent;opacity:.45}
.cal-d.now::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.cal-d .n{position:absolute;top:2px;right:4px;font-size:10px;line-height:1}
.legend .sw-clean{background:var(--plate-white)} .legend .sw-part{background:rgba(217,213,204,.26)} .legend .sw-slip{background:var(--red)}
.insights{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--chalk-2)}
.insights b{color:var(--chalk);font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumb{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:10px;overflow:hidden;background:var(--iron-2);display:block;width:100%}
.thumb img,.cmp .ph img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 5px;font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:left}
img.broken{visibility:hidden}
.upload{display:block;text-align:center;cursor:pointer}
.upload.busy{opacity:.6;cursor:default}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.cmp .ph{aspect-ratio:3/4;max-width:100%;border-radius:10px;overflow:hidden;background:var(--iron-2);width:100%;display:block}
.cmp figcaption{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cmp figcaption div{display:flex;flex-direction:column;min-width:0;text-align:center;flex:1}
.cmp figcaption b{font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-3)}
.cmp figcaption span{font-size:13.5px;font-variant-numeric:tabular-nums}
.cmp .nav-btn{width:32px;height:32px;border-radius:8px;background:var(--iron-2);flex:none}
.cmp .nav-btn svg{width:14px;height:14px}
.cmp-sum{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;text-align:center;font-variant-numeric:tabular-nums}
.lb{position:fixed;inset:0;z-index:30;background:rgba(10,10,12,.95);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb-in{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
.lb img{width:100%;max-height:62vh;object-fit:contain;border-radius:10px;background:var(--iron)}
.lb-meta{text-align:center;font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk-2)}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wstat{display:flex;flex-direction:column;gap:2px;min-width:0}
.wstat b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.wstat b small{font-size:14px;color:var(--chalk-3);margin-left:2px}
.wstat span{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-3)}
.wchart{position:relative}
.wchart svg{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
.wchart svg:focus-visible{outline:2px solid var(--chalk);outline-offset:4px;border-radius:4px}
.wtip{position:absolute;top:-6px;transform:translate(-50%,-100%);pointer-events:none;background:var(--iron-3);border:1px solid var(--line);border-radius:8px;padding:6px 10px;white-space:nowrap;z-index:2}
.wtip b{display:block;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;color:var(--chalk)}
.wtip span{font-size:12.5px;color:var(--chalk-2)}
.legend .key-line{width:14px;height:2px;border-radius:1px;background:var(--red)}
.legend .key-dot{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.legend .key-goal{width:14px;height:0;border-top:1.5px dashed var(--chalk-2);background:none;border-radius:0}
.wlog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details.wtable summary{cursor:pointer;font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-2);padding-block:4px}
details.wtable[open] summary{margin-bottom:6px}
.quote{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:14px;background:var(--iron);border:1px solid var(--iron-3)}
.quote blockquote{margin:0;font-family:var(--label);font-weight:600;font-size:22px;line-height:1.2;letter-spacing:.01em;text-wrap:balance;color:var(--chalk)}
.quote blockquote.mine::before{content:"Your words";display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.quote blockquote.hard{color:var(--red)}
.quote-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.quote-bar .go{--c:var(--chalk-3);font-size:13px}
.sleep-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sleep-row input{min-height:44px}
.qual{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.qual button{padding:9px 2px;border-radius:8px;background:var(--iron-2);font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--chalk-2)}
.qual button.on{background:var(--c);color:var(--ink)}
.note-ok{font-size:13.5px;color:var(--chalk-2)}
.note-bad{font-size:13.5px;color:var(--red)}
.schart{position:relative}
.schart svg{width:100%;height:auto;display:block}
.schart .hit{fill:transparent;cursor:pointer}
.schart .hit:hover + .bar,.schart .bar.hl{filter:brightness(1.18)}
.legend .key-sleep{width:10px;height:10px;border-radius:2px;background:var(--sleep)}
.glasses{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.glasses i{height:22px;border-radius:3px 3px 6px 6px;background:var(--iron-2);box-shadow:inset 0 0 0 1px var(--iron-3)}
.glasses i.full{background:var(--water);box-shadow:none}
.glasses i.half{background:linear-gradient(to top,var(--water) 50%,var(--iron-2) 50%)}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;background:var(--iron-2);text-align:left;font-weight:500;width:100%}
.check .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--chalk-3);display:grid;place-items:center;flex:none}
.check.on{color:var(--chalk-3)}
.check.on .t{text-decoration:line-through;text-decoration-color:var(--chalk-3)}
.check.on .box{background:var(--c);border-color:var(--c)}
.check.on .box::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateY(-1px) rotate(-45deg)}
.edit-row{display:flex;align-items:center;gap:8px;padding:6px 0 6px 12px;border-radius:10px;background:var(--iron-2)}
.edit-row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.add-row{display:flex;gap:8px}
.add-row .mini{flex:none}
.ch .go{margin-left:auto}
.rating{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rating button{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--iron-2);font-family:var(--display);font-weight:800;font-size:17px;color:var(--chalk-2);font-variant-numeric:tabular-nums}
.rating button.on{background:var(--chalk);color:var(--ink)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding-block:9px;border-top:1px solid var(--iron-3)}
.li:first-child{border-top:0;padding-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:13.5px;color:var(--chalk-3);font-variant-numeric:tabular-nums}
.li .v{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}

<body>
<div class="wrap">
  <div class="brand"><span><b>CP</b></span><span id="sync">Loading…</span></div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = x => JSON.parse(JSON.stringify(x));
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const todayKey = () => keyOf(new Date());
const fmtLong = k => parseKey(k).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
const fmtShort = k => parseKey(k).toLocaleDateString('en-GB', {day:'numeric', month:'short'});
const weekStart = k => addDays(k, -((parseKey(k).getDay()+6)%7));

const PILLARS = [
  {k:'gym', name:'Gym', c:'var(--red)'},
  {k:'coding', name:'Vibe coding', c:'var(--blue)'},
  {k:'chinese', name:'Chinese', c:'var(--yellow)'},
  {k:'content', name:'Content', c:'var(--green)'}
];
const SPLITS = ['Push','Pull','Legs','Upper','Lower','Full body','Cardio'];
const COMMON_LIFTS = ['Bench press','Squat','Deadlift','Overhead press','Barbell row','Pull-up','Lat pulldown','Incline dumbbell press','Romanian deadlift','Leg press','Hip thrust','Dumbbell curl','Tricep pushdown','Lateral raise'];
const ICON_X = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';

function defaultSettings(){
  const t = todayKey();
  return {
    targets:{coding:60, chinese:20, content:30, water:3000, sleep:8, bedtime:'23:30'},
    unit:'kg',
    quotes:['If you need motivation, look at your dad.'],
    morning:[
      {id:'m1', name:'Up on the first alarm'},
      {id:'m2', name:'Drink 500 ml water'},
      {id:'m3', name:'Make the bed'},
      {id:'m4', name:'No phone for the first 30 min'},
      {id:'m5', name:'Cold shower'},
      {id:'m6', name:'Write today\'s top 3'}
    ],
    quits:[
      {id:'scroll', name:'Doom scrolling', since:t, best:0},
      {id:'smoke', name:'Smoking', since:t, best:0},
      {id:'porn', name:'Porn', since:t, best:0},
      {id:'sugar', name:'Sugar', since:t, best:0}
    ]
  };
}
function normSettings(s){
  const d = defaultSettings(); s = s || {};
  return {
    targets: Object.assign(d.targets, s.targets || {}),
    unit: s.unit === 'lb' ? 'lb' : 'kg',
    morning: Array.isArray(s.morning) ? s.morning : d.morning,
    goalWeight: typeof s.goalWeight === 'number' && s.goalWeight > 0 ? s.goalWeight : null,
    quotes: Array.isArray(s.quotes) ? s.quotes.filter(q => typeof q === 'string') : d.quotes,
    quits: Array.isArray(s.quits) ? s.quits : d.quits
  };
}
const blankDay = k => ({date:k, gym:null, excuse:'', split:'', lifts:[], coding:0, built:'', chinese:0, words:[], content:0, posted:false, contentNote:'', clean:{}, slips:{}, slipPrev:{}, morning:{}, rating:0, note:'', rvWell:'', rvBad:'', rvFix:'', rvDone:false, photos:[], weight:null, water:0, sleepBed:'', sleepWake:'', sleepQ:0});

const state = {settings:null, days:{}, view:'today', date:todayKey(), lastToday:todayKey(), pending:null, sync:'local', review:null, editMorning:false, pose:'Front', uploading:false, cmp:{pose:'Front', a:null, b:null}, tlPose:'All', lightbox:null, wRange:'90', liftDraft:{ex:'', w:'', r:'', s:'3'}};

/* ---------- storage: device cache + account sync ---------- */
const LS = 'fourplates.v1', LS_UI = 'fourplates.ui';
function loadCache(){
  try{ const j = JSON.parse(localStorage.getItem(LS) || 'null'); if(j){ state.settings = j.settings || null; state.days = j.days || {}; } }catch(e){}
  try{ const u = JSON.parse(localStorage.getItem(LS_UI) || 'null'); if(u && u.view) state.view = u.view; }catch(e){}
}
function saveCache(){ try{ localStorage.setItem(LS, JSON.stringify({settings:state.settings, days:state.days})); }catch(e){} }
function saveUI(){ try{ localStorage.setItem(LS_UI, JSON.stringify({view:state.view})); }catch(e){} }

let db = null, pushedLocal = false;
const dirty = new Set(), timers = {}, writing = {};
function persist(path){
  saveCache();
  if(!db) return;
  dirty.add(path);
  clearTimeout(timers[path]);
  timers[path] = setTimeout(() => flush(path), 500);
  setSync('saving');
}
async function flush(path){
  timers[path] = null;
  if(writing[path]){ timers[path] = setTimeout(() => flush(path), 300); return; }
  writing[path] = true;
  const body = () => clone(path === 'app/settings' ? state.settings : (state.days[path.slice(5)] || {}));
  let ok = true;
  try{ await db.doc(path).set(body()); }
  catch(e){
    if(e && e.code === 'unavailable'){
      await new Promise(r => setTimeout(r, 600 + Math.random()*800));
      try{ await db.doc(path).set(body()); }catch(e2){ ok = false; }
    } else ok = false;
  }
  writing[path] = false;
  if(!timers[path]) dirty.delete(path);
  if(!ok){ setSync('error'); return; }
  if(dirty.size === 0) setSync('synced');
}
function setSync(s){
  state.sync = s;
  const el = $('#sync'); if(!el) return;
  el.textContent = {local:'Saved on this device', synced:'Synced', saving:'Saving…', error:'Sync paused · saved on this device'}[s];
  el.classList.toggle('bad', s === 'error');
}
async function initDb(){
  let ns = null;
  try{ ns = (window.claude && window.claude.use) ? await window.claude.use('db') : null; }catch(e){ ns = null; }
  if(!ns){ setSync('local'); return; }
  db = ns; setSync('synced');
  db.doc('app/settings').onSnapshot(snap => {
    if(dirty.has('app/settings')) return;
    if(snap.exists){ state.settings = normSettings(clone(snap.data())); saveCache(); requestRender(); }
    else if(!snap.metadata.fromCache) persist('app/settings');
  }, () => setSync('error'));
  db.collection('days').orderBy('date','desc').limit(800).onSnapshot(snap => {
    const seen = new Set();
    for(const doc of snap.docs){
      seen.add(doc.id);
      if(dirty.has('days/'+doc.id)) continue;
      state.days[doc.id] = clone(doc.data());
    }
    if(!snap.metadata.fromCache && !pushedLocal){
      pushedLocal = true;
      for(const k of Object.keys(state.days)) if(!seen.has(k)) persist('days/'+k);
    }
    saveCache(); requestRender();
  }, () => setSync('error'));
}

/* ---------- backup: export & import ---------- */
let downloads = null;
const LS_BACKUP = 'fourplates.lastBackup';
const inClaude = !!(window.claude && window.claude.use);
async function initDownloads(){
  try{ downloads = inClaude ? await window.claude.use('downloads') : null; }catch(e){ downloads = null; }
  requestRender();
}
function lastBackup(){ try{ return localStorage.getItem(LS_BACKUP); }catch(e){ return null; } }
function markBackup(){ try{ localStorage.setItem(LS_BACKUP, todayKey()); }catch(e){} }
function backupJSON(){
  return JSON.stringify({app:'CP', version:1, exportedAt:new Date().toISOString(), settings:state.settings, days:state.days});
}
async function exportBackup(){
  const name = 'cp-backup-'+todayKey()+'.json', data = backupJSON();
  if(downloads){
    try{ await downloads.save({filename:name, data}); markBackup(); toast('Backup saved.'); render(); }
    catch(e){ if(!(e && e.code === 'declined')) toast('Couldn\'t save the file. Use Copy backup instead.'); }
    return;
  }
  if(inClaude){ toast('File saving isn\'t available here. Use Copy backup instead.'); return; }
  try{
    const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    markBackup(); toast('Backup downloaded.'); render();
  }catch(e){ toast('Couldn\'t download. Use Copy backup instead.'); }
}
function copyBackup(){
  const data = backupJSON();
  const done = () => { markBackup(); toast('Backup copied. Paste it somewhere safe, like Notes.'); render(); };
  const fallback = () => { state.showBackupText = true; render(); setTimeout(() => { const t = $('#backup-text'); if(t){ t.focus(); t.select(); } }, 0); };
  try{ navigator.clipboard.writeText(data).then(done, fallback); }catch(e){ fallback(); }
}
function parseBackup(text){
  let b; try{ b = JSON.parse(text); }catch(e){ return {error:'That isn\'t a CP backup file.'}; }
  if(!b || typeof b !== 'object' || !b.days || typeof b.days !== 'object' || Array.isArray(b.days) || !b.settings || typeof b.settings !== 'object') return {error:'That isn\'t a CP backup file.'};
  const days = {};
  for(const [k, d] of Object.entries(b.days)){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !d || typeof d !== 'object' || Array.isArray(d)) continue;
    days[k] = Object.assign({}, d, {date:k});
  }
  return {backup:{settings:b.settings, days, exportedAt:b.exportedAt || null}};
}
function readImportFile(file){
  const r = new FileReader();
  r.onload = () => { const p = parseBackup(String(r.result || '')); if(p.error){ toast(p.error); return; } state.pendingImport = p.backup; render(); };
  r.onerror = () => toast('Couldn\'t read that file.');
  r.readAsText(file);
}
async function applyImport(b){
  const oldKeys = Object.keys(state.days);
  state.settings = normSettings(b.settings);
  state.days = b.days;
  state.pendingImport = null; state.showBackupText = false;
  saveCache();
  const n = Object.keys(b.days).length;
  if(db){
    const keys = Object.keys(b.days), gone = oldKeys.filter(k => !b.days[k]);
    dirty.add('app/settings'); keys.concat(gone).forEach(k => dirty.add('days/'+k));
    setSync('saving'); render();
    let failed = false;
    try{ await db.doc('app/settings').set(clone(state.settings)); }catch(e){ failed = true; }
    dirty.delete('app/settings');
    const run = async (list, fn) => { for(let i = 0; i < list.length; i += 8) await Promise.all(list.slice(i, i+8).map(k => fn(k).catch(() => { failed = true; }).then(() => dirty.delete('days/'+k)))); };
    await run(keys, k => db.doc('days/'+k).set(clone(state.days[k])));
    await run(gone, k => db.doc('days/'+k).delete());
    setSync(failed ? 'error' : 'synced');
    if(failed){ toast('Restored on this device, but some days didn\'t sync. Reopen the app to retry.'); render(); return; }
  }
  toast('Backup restored: '+n+' day'+(n === 1 ? '' : 's')+'.'); render();
}
function backupCard(){
  const lb = lastBackup(), t = todayKey(), ago = lb ? daysBetween(lb, t) : null, nDays = Object.keys(state.days).length;
  let b = '<p>'+(lb ? 'Last backup on this device: <b>'+(ago === 0 ? 'today' : ago === 1 ? 'yesterday' : ago+' days ago')+'</b>.' : '<span class="note-bad">No backup yet.</span>')
    + (ago == null || ago > 7 ? ' Back up once a week so you never lose your streak.' : '')+'</p>';
  b += '<div class="row2"><button class="mini on" data-act="export"'+(inClaude && !downloads ? ' disabled' : '')+'>Save backup file</button><button class="mini" data-act="copy-backup">Copy backup</button></div>';
  if(state.showBackupText) b += '<label class="fld"><span>Copy all of this and keep it somewhere safe.</span><textarea id="backup-text" rows="4" readonly>'+esc(backupJSON())+'</textarea></label>';
  const pi = state.pendingImport;
  if(pi){
    const n = Object.keys(pi.days).length, when = pi.exportedAt ? new Date(pi.exportedAt).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : 'an unknown date';
    b += '<div class="card" style="--c:var(--red);background:var(--iron-2)"><p><b>Restore backup from '+esc(when)+'?</b> It has '+n+' logged day'+(n === 1 ? '' : 's')+'. This replaces everything in the app now ('+nDays+' day'+(nDays === 1 ? '' : 's')+').</p>'
      + '<div class="row2"><button class="mini danger" data-act="import-yes">Replace my data</button><button class="mini" data-act="import-no">Cancel</button></div></div>';
  } else {
    b += '<label class="mini ghost upload" style="text-align:center">Restore from backup file<input id="import-in" type="file" accept="application/json,.json,text/plain" hidden></label>'
      + '<details class="wtable"><summary>Paste backup text instead</summary><div class="checks"><textarea id="import-text" rows="3" placeholder="Paste your backup here"></textarea><button class="mini" data-act="import-paste">Check backup</button></div></details>';
  }
  b += '<p class="empty">Backups include all your logs, settings, weight and sleep. Progress photos aren\'t inside the file.</p>';
  return card('var(--chalk)', 'Backup', '', false, b);
}

let assets = null, assetsChecked = false;
async function initAssets(){
  try{ assets = (window.claude && window.claude.use) ? await window.claude.use('assets') : null; }catch(e){ assets = null; }
  assetsChecked = true; requestRender();
}

/* ---------- progress photos ---------- */
const POSES = ['Front','Side','Back'];
const imgSrc = id => '/_blob/'+id;
function allPhotos(){
  const out = [];
  for(const [k,d] of Object.entries(state.days)) (d.photos||[]).forEach((p, i) => out.push({k, i, id:p.id, pose:p.pose || 'Front', weight:d.weight}));
  return out.sort((a,b) => a.k.localeCompare(b.k) || a.i - b.i);
}
function compress(file){
  // Re-encoding through a canvas shrinks the upload and drops EXIF data such as GPS location.
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth*scale); c.height = Math.round(img.naturalHeight*scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject({code:'encode'}), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject({code:'decode'}); };
    img.src = url;
  });
}
const ASSET_MSG = {too_large:'That photo is too big. Try a smaller one.', unsupported_type:'That file type isn\'t supported. Use a JPG or PNG.', quota_or_state:'Photo storage is full. Delete some old photos first.', rate_limited:'Too many uploads at once. Wait a moment and try again.', upstream_auth:'Sign-in expired. Reload the page and try again.', decode:'Couldn\'t read that image. Try a JPG or PNG.', encode:'Couldn\'t process that image. Try another one.'};
async function uploadPhoto(file){
  if(!assets || state.uploading) return;
  const k = state.date, pose = state.pose;
  state.uploading = true; render();
  try{
    const blob = await compress(file);
    let res;
    try{ res = await assets.upload(blob, {type:'image/jpeg'}); }
    catch(e){ if(e && e.code === 'store_unavailable'){ await new Promise(r => setTimeout(r, 1200)); res = await assets.upload(blob, {type:'image/jpeg'}); } else throw e; }
    mut(k, d => { d.photos = d.photos || []; d.photos.push({id:res.id, pose}); });
    state.cmp = {pose, a:null, b:null};
    toast(pose+' photo saved.');
  }catch(e){ toast(ASSET_MSG[e && e.code] || 'Upload failed. Try again.'); }
  state.uploading = false; render();
}
async function deletePhoto(k, i){
  const p = (getDay(k).photos || [])[i]; if(!p) return;
  try{ if(assets) await assets.delete(p.id); }
  catch(e){ toast(ASSET_MSG[e && e.code] || 'Couldn\'t delete that photo. Try again.'); return; }
  mut(k, d => { d.photos.splice(i, 1); });
  state.lightbox = null; state.pending = null; state.cmp.a = state.cmp.b = null;
  toast('Photo deleted.'); render();
}

/* ---------- model ---------- */
function getDay(k){ return Object.assign(blankDay(k), state.days[k] || {}); }
function mut(k, fn){ const d = clone(getDay(k)); fn(d); state.days[k] = d; persist('days/'+k); }
function mutS(fn){ fn(state.settings); persist('app/settings'); }

function prog(d){
  const t = state.settings.targets;
  return {
    gym: (d.gym === 'trained' || d.gym === 'rest') ? 1 : 0,
    coding: Math.min(1, (d.coding||0) / Math.max(1, t.coding)),
    chinese: Math.min(1, (d.chinese||0) / Math.max(1, t.chinese)),
    content: d.posted ? 1 : Math.min(1, (d.content||0) / Math.max(1, t.content))
  };
}
const isClean = (d, id) => !!(d.clean[id] && !d.slips[id]);
const cleanCount = d => state.settings.quits.filter(q => isClean(d, q.id)).length;
const slipped = d => state.settings.quits.some(q => d.slips[q.id]);
function score(d){
  const p = prog(d), sum = p.gym + p.coding + p.chinese + p.content, n = state.settings.quits.length;

/* Sleep is logged on the day you wake up. Clock times before 18:00 count as after midnight. */
const toMin = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? Number(m[1])*60 + Number(m[2]) : null; };

const bedOnTime = d => { const b = nightMin(d.sleepBed), t = nightMin(state.settings.targets.bedtime); return b != null && t != null && b <= t; };
const fmtDur = m => Math.floor(m/60)+'h '+pad(m%60)+'m';
const fmtClock = n => { n = ((Math.round(n) % 1440) + 1440) % 1440; return pad(Math.floor(n/60))+':'+pad(n%60); };
const waterHit = d => (d.water || 0) >= state.settings.targets.water;
const fmtL = ml => (Math.round(ml/50)/20)+' L';

/* XP is derived from history each time, so it can't drift or double-count. */
const XP = {sleep:10, bedtime:10, water:10, review:50, won:50, morning:20, streakStep:10, streakCap:100, pr:25, word:5, slip:-30, skip:-25};
const RANKS = [[1,'Rookie'],[3,'Grinder'],[5,'Disciplined'],[8,'Iron Will'],[12,'Machine'],[16,'Beast Mode'],[20,'Legend'],[30,'Unbreakable']];
function xpLedger(){
  const t = todayKey(), ks = Object.keys(state.days).filter(k => k <= t).sort();
  const maxW = {}, byDay = {};

  for(const k of ks){
    const d = getDay(k), parts = [];
    let prc = 0;
    for(const l of d.lifts){ const n = l.ex.toLowerCase(); if(maxW[n] != null && l.w > maxW[n]) prc++; maxW[n] = maxW[n] == null ? l.w : Math.max(maxW[n], l.w); }

    if(w){ streak = (lastWon && addDays(lastWon, 1) === k) ? streak + 1 : 1; lastWon = k; }

    if(w) parts.push(['Won day', XP.won]);
    if(w && streak > 1) parts.push(['Streak day '+streak, Math.min(XP.streakCap, XP.streakStep*(streak-1))]);
    if(mornFull(d)) parts.push(['Morning routine', XP.morning]);
    if(waterHit(d)) parts.push(['Water goal', XP.water]);
    if(sleepHit(d)) parts.push(['Slept '+state.settings.targets.sleep+'h+', XP.sleep]);
    if(bedOnTime(d)) parts.push(['In bed on time', XP.bedtime]);
    if(prc) parts.push(['New PR'+(prc > 1 ? ' ×'+prc : ''), XP.pr*prc]);
    if(d.words.length) parts.push(['New words ×'+d.words.length, XP.word*d.words.length]);

    if(d.rvDone) parts.push(['Weekly review', XP.review]);

}
function levelOf(x){

const rankOf = L => RANKS.filter(r => r[0] <= L).pop()[1];

const cleanDays = q => Math.max(0, daysBetween(q.since, todayKey()));

function allLifts(){ const out = []; for(const [k,d] of Object.entries(state.days)) (d.lifts||[]).forEach((l,i) => out.push(Object.assign({date:k, i}, l))); return out; }

const fmtW = w => (Math.round(w*100)/100) + ' ' + state.settings.unit;

function plate(x, w, h, color, st){

  if(st === 'part') return '<rect class="pl" x="'+(x+.75)+'" y="'+(y+.75)+'" width="'+(w-1.5)+'" height="'+(h-1.5)+'" rx="3" style="fill:'+color+';fill-opacity:.28;stroke:'+color+';stroke-width:1.5"/>';
  if(st === 'slip') return '<rect class="pl" x="'+(x+.75)+'" y="'+(y+.75)+'" width="'+(w-1.5)+'" height="'+(h-1.5)+'" rx="2" style="fill:none;stroke:var(--red);stroke-width:1.5;stroke-dasharray:3 2"/>';
  return '<rect class="pl" x="'+(x+.75)+'" y="'+(y+.75)+'" width="'+(w-1.5)+'" height="'+(h-1.5)+'" rx="3" style="fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 3"/>';
}

  PILLARS.forEach((pl, i) => {
    const st = p[pl.k] >= 1 ? 'full' : p[pl.k] > 0 ? 'part' : 'empty';

function relapseCalendar(){
  const t = todayKey(), qs = state.settings.quits;
  if(!qs.length) return '';
  const hab = qs.some(q => q.id === state.calHabit) ? state.calHabit : 'all';
  const ym = state.calMonth || t.slice(0, 7), [y, m] = ym.split('-').map(Number);
  const first = ym+'-01', daysIn = new Date(y, m, 0).getDate(), lead = (parseKey(first).getDay()+6)%7;
  const slipsOn = d => hab === 'all' ? qs.filter(q => d.slips[q.id]).length : (d.slips[hab] ? 1 : 0);
  const chev = p => '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="'+p+'" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let cells = ['M','T','W','T','F','S','S'].map(l => '<span class="wd">'+l+'</span>').join('') + '<span></span>'.repeat(lead);
  let mSlips = 0, mClean = 0;
  for(let i = 1; i <= daysIn; i++){
    const k = ym+'-'+pad(i), d = state.days[k] ? getDay(k) : null;
    let cls = '', status = 'no check-in', badge = '';
    if(k > t){ cls = 'fut'; status = 'upcoming'; }
    else if(d){
      const sl = slipsOn(d);
      const cl = hab === 'all' ? qs.filter(q => isClean(d, q.id)).length : (isClean(d, hab) ? 1 : 0), need = hab === 'all' ? qs.length : 1;
      if(sl){ cls = 'slip'; status = sl > 1 ? sl+' slips' : 'slipped'; if(sl > 1) badge = '<span class="n">'+sl+'</span>'; mSlips += sl; }
      else if(cl === need){ cls = 'clean'; status = 'clean'; mClean++; }
      else if(cl){ cls = 'part'; status = cl+' of '+need+' clean'; }
    }
    if(k === t) cls += ' now';
    cells += '<button class="cal-d '+cls+'" data-act="goto-day" data-v="'+k+'" aria-label="'+fmtLong(k)+': '+status+'"'+(k > t ? ' disabled' : '')+'>'+i+badge+'</button>';
  }
  // All-history insights for the selected habit
  const wdCount = [0,0,0,0,0,0,0]; let lastSlip = null, total = 0;
  for(const k of Object.keys(state.days)){
    if(k > t) continue;
    const n = slipsOn(getDay(k)); if(!n) continue;
    total += n; wdCount[(parseKey(k).getDay()+6)%7] += n;
    if(!lastSlip || k > lastSlip) lastSlip = k;
  }
  const WD = ['Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays','Sundays'];
  const maxN = Math.max.apply(null, wdCount), worst = wdCount.indexOf(maxN);
  let ins = '<span>This month: <b>'+mSlips+' slip'+(mSlips === 1 ? '' : 's')+'</b> · <b>'+mClean+' clean day'+(mClean === 1 ? '' : 's')+'</b></span>';
  if(lastSlip){ const ago = daysBetween(lastSlip, t); ins += '<span>Last slip: <b>'+fmtLong(lastSlip)+'</b>, '+(ago === 0 ? 'today' : ago === 1 ? 'yesterday' : ago+' days ago')+'</span>'; }
  else ins += '<span>No slips logged. Keep it that way.</span>';
  if(total >= 3 && maxN >= 2) ins += '<span>Danger day: <b>'+WD[worst]+'</b> ('+maxN+' of '+total+' slips). Plan ahead for it.</span>';
  const chips = '<div class="chips"><button class="chip'+(hab === 'all' ? ' on' : '')+'" data-act="cal-habit" data-v="all">All habits</button>'
    + qs.map(q => '<button class="chip'+(hab === q.id ? ' on' : '')+'" data-act="cal-habit" data-v="'+q.id+'">'+esc(q.name)+'</button>').join('')+'</div>';
  const monthName = parseKey(first).toLocaleDateString('en-GB', {month:'long', year:'numeric'});
  return card('var(--plate-white)', 'Relapse calendar', '', false, chips
    + '<div class="cal-head"><button class="nav-btn" data-act="cal-prev" aria-label="Previous month">'+chev('M12.5 4l-6 6 6 6')+'</button><span class="cal-title">'+monthName+'</span>'
    + '<button class="nav-btn" data-act="cal-next" aria-label="Next month"'+(ym >= t.slice(0, 7) ? ' disabled' : '')+'>'+chev('M7.5 4l6 6-6 6')+'</button></div>'
    + '<div class="cal">'+cells+'</div>'
    + '<div class="legend"><i class="sw-clean"></i> Clean '+(hab === 'all' ? '<i class="sw-part"></i> Some clean ' : '')+'<i class="sw-slip"></i> Slipped <i></i> No check-in</div>'
    + '<div class="insights">'+ins+'</div>'
    + '<p class="empty">Tap a day to open it and fix a check-in.</p>');
}
/* ---------- weight chart ---------- */
const r1 = v => Math.round(v*10)/10;
function weightSeries(){
  const t = todayKey();
  const e = Object.keys(state.days).filter(k => k <= t && typeof state.days[k].weight === 'number').sort().map(k => ({k, w:state.days[k].weight}));
  e.forEach((p, i) => { let s = 0, n = 0; for(let j = i; j >= 0 && daysBetween(e[j].k, p.k) <= 6; j--){ s += e[j].w; n++; } p.avg = r1(s/n); });
  return e;
}
function niceStep(span){ const raw = span/4; for(const s of [0.5,1,2,2.5,5,10,20,25,50]) if(s >= raw) return s; return 100; }
let wChart = null;
function weightChart(pts, from){
  wChart = null;
  if(!pts.length) return '<p class="empty">No weigh-ins in this range.</p>';
  const t = todayKey(), goal = state.settings.goalWeight;
  let lo = Math.min.apply(null, pts.map(p => Math.min(p.w, p.avg))), hi = Math.max.apply(null, pts.map(p => Math.max(p.w, p.avg)));
  if(goal != null){ lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  if(hi - lo < 1){ const m = (hi+lo)/2; lo = m - 0.5; hi = m + 0.5; }
  const step = niceStep(hi - lo); lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const W = 340, H = 190, L = 34, R = 12, T = 14, B = 24;
  const x0 = parseKey(from).getTime(), x1 = Math.max(parseKey(t).getTime(), x0 + 864e5);
  const X = k => r1(L + (parseKey(k).getTime() - x0)/(x1 - x0)*(W - L - R)), Y = v => r1(T + (hi - v)/(hi - lo)*(H - T - B));
  const fmtN = v => String(r1(v));
  let s = '<svg viewBox="0 0 '+W+' '+H+'" tabindex="0" role="img" aria-label="Weight from '+fmtLong(pts[0].k)+' to '+fmtLong(pts[pts.length-1].k)+'. Use arrow keys to step through weigh-ins.">';
  for(let v = lo; v <= hi + 1e-9; v += step){
    s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" style="stroke:var(--iron-3);stroke-width:1"/>'
      + '<text x="'+(L-6)+'" y="'+(Y(v)+3.5)+'" text-anchor="end" style="fill:var(--chalk-3);font:500 10.5px var(--body)">'+fmtN(v)+'</text>';
  }
  s += '<text x="'+L+'" y="'+(H-6)+'" style="fill:var(--chalk-3);font:500 10.5px var(--body)">'+fmtShort(from)+'</text>'
    + '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" style="fill:var(--chalk-3);font:500 10.5px var(--body)">'+fmtShort(t)+'</text>';
  if(goal != null) s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(goal)+'" y2="'+Y(goal)+'" style="stroke:var(--chalk-2);stroke-width:1.5;stroke-dasharray:5 4"/>'
    + '<text x="'+(W-R)+'" y="'+(Y(goal) - 5)+'" text-anchor="end" style="fill:var(--chalk-2);font:600 10.5px var(--body)">Goal '+fmtN(goal)+'</text>';
  const line = pts.map(p => X(p.k)+','+Y(p.avg)).join(' ');
  if(pts.length > 1){
    s += '<path d="M'+X(pts[0].k)+','+Y(lo)+' L'+line.replace(/ /g, ' L')+' L'+X(pts[pts.length-1].k)+','+Y(lo)+' Z" style="fill:var(--red);fill-opacity:.1"/>'
      + '<polyline points="'+line+'" style="fill:none;stroke:var(--red);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>';
  }
  s += pts.map(p => '<circle cx="'+X(p.k)+'" cy="'+Y(p.w)+'" r="4" style="fill:var(--dot);stroke:var(--iron);stroke-width:2"/>').join('');
  const last = pts[pts.length-1];
  s += '<circle cx="'+X(last.k)+'" cy="'+Y(last.avg)+'" r="5" style="fill:var(--red);stroke:var(--iron);stroke-width:2"/>';
  s += '<line id="wx" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" style="stroke:var(--chalk-2);stroke-width:1;display:none"/>'
    + '<circle id="wha" r="5" style="fill:var(--red);stroke:var(--iron);stroke-width:2;display:none"/>'
    + '<circle id="wh" r="5.5" style="fill:var(--chalk);stroke:var(--iron);stroke-width:2;display:none"/>';
  s += '</svg>';
  wChart = {W, pts:pts.map(p => ({k:p.k, w:p.w, avg:p.avg, x:X(p.k), y:Y(p.w), ay:Y(p.avg)})), sel:pts.length - 1};
  return '<div class="wchart">'+s+'<div class="wtip" hidden></div></div>';
}
function wShow(i){
  const svg = $('.wchart svg'); if(!wChart || !svg) return;
  const p = wChart.pts[i]; if(!p) return; wChart.sel = i;
  const cx = svg.querySelector('#wx'), hd = svg.querySelector('#wh'), ha = svg.querySelector('#wha'), tip = svg.parentNode.querySelector('.wtip');
  cx.setAttribute('x1', p.x); cx.setAttribute('x2', p.x); cx.style.display = '';

  tip.append(b, sp); tip.hidden = false;
  const bw = svg.getBoundingClientRect().width, tw = tip.offsetWidth, px = p.x/wChart.W*bw;

function wHide(){
  const svg = $('.wchart svg'); if(!svg) return;
  ['#wx','#wh','#wha'].forEach(s => { const e = svg.querySelector(s); if(e) e.style.display = 'none'; });
  const tip = svg.parentNode.querySelector('.wtip'); if(tip) tip.hidden = true;
}
function wNearest(clientX, svg){
  const r = svg.getBoundingClientRect(), x = (clientX - r.left)/r.width*wChart.W;
  let best = 0; wChart.pts.forEach((p, i) => { if(Math.abs(p.x - x) < Math.abs(wChart.pts[best].x - x)) best = i; });
  return best;
}
['pointermove','pointerdown'].forEach(ev => document.addEventListener(ev, e => {
  const svg = e.target.closest && e.target.closest('.wchart svg'); if(!svg || !wChart) return;
  wShow(wNearest(e.clientX, svg));
}));
document.addEventListener('pointerout', e => {
  if(e.pointerType !== 'mouse' || !e.target.closest || !e.target.closest('.wchart svg')) return;
  if(!(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.wchart svg'))) wHide();
});
document.addEventListener('focusin', e => { if(e.target.matches && e.target.matches('.wchart svg') && wChart) wShow(wChart.sel); });
document.addEventListener('focusout', e => { if(e.target.matches && e.target.matches('.wchart svg')) wHide(); });
document.addEventListener('keydown', e => {

  if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ e.preventDefault(); wShow(Math.max(0, Math.min(wChart.pts.length - 1, wChart.sel + (e.key === 'ArrowRight' ? 1 : -1)))); }
});

function weekTotals(ws, led){
  const o = {gym:0, coding:0, chinese:0, words:0, posts:0, won:0, morning:0, water:0, sleepSum:0, sleepN:0, bedOk:0, slips:0, skips:0, xp:0, plates:{gym:0, coding:0, chinese:0, content:0}, best:null, worst:null};
  for(let i = 0; i < 7; i++){
    const k = addDays(ws, i); if(!state.days[k]) continue;
    const d = getDay(k), p = prog(d), sc = score(d);
    if(d.gym === 'trained') o.gym++;
    if(d.gym === 'skip') o.skips++;
    o.coding += d.coding || 0; o.chinese += d.chinese || 0; o.words += d.words.length;
    if(d.posted) o.posts++;
    if(mornFull(d)) o.morning++;
    if(waterHit(d)) o.water++;
    const sm = sleepMins(d); if(sm != null){ o.sleepSum += sm; o.sleepN++; }
    if(bedOnTime(d)) o.bedOk++;
    if(won(d)) o.won++;
    o.slips += state.settings.quits.filter(q => d.slips[q.id]).length;
    for(const pl of PILLARS) if(p[pl.k] >= 1) o.plates[pl.k]++;
    if(led && led.byDay[k]) o.xp += led.byDay[k].sum;
    if(!o.best || sc > o.best.s) o.best = {k, s:sc};
    if(!o.worst || sc < o.worst.s) o.worst = {k, s:sc};
  }
  return o;
}
const sunOf = ws => addDays(ws, 6);
function reviewPrompt(){
  const t = todayKey(), dow = (parseKey(t).getDay()+6)%7;
  let ws = null, late = false;
  if(dow === 6) ws = weekStart(t);
  else if(dow === 0){ const prev = addDays(weekStart(t), -7); if(!getDay(sunOf(prev)).rvDone){ ws = prev; late = true; } }
  if(!ws || getDay(sunOf(ws)).rvDone) return '';
  let logged = false; for(let i = 0; i < 7; i++) if(state.days[addDays(ws, i)]) logged = true;
  if(!logged) return '';
  return card('var(--chalk)', late ? 'Missed review' : 'Sunday review', '+'+XP.review+' XP', false,
    '<p>'+(late ? 'Last week\'s review isn\'t done. Close it out before this week gets going.' : 'Look back at your week, own the misses and pick one thing to fix.')+'</p>'
    + '<button class="primary" data-act="review" data-v="'+ws+'">Start weekly review</button>');
}

];
function render(){
  renderPending = false;
  if(state.view !== 'review' && !TABS.some(t => t[0] === state.view)) state.view = 'today';
  const v = state.view;
  $('#view').innerHTML = v === 'review' ? viewReview() : v === 'body' ? viewBody() : v === 'gym' ? viewGym() : v === 'chinese' ? viewChinese() : v === 'quit' ? viewQuit() : v === 'stats' ? viewStats() : viewToday();
  $('#tabs').innerHTML = TABS.map(([id, label, icon]) => '<button class="tab'+(v === id ? ' on' : '')+'" data-act="tab" data-v="'+id+'"'+(v === id ? ' aria-current="page"' : '')+'>'+icon+label+'</button>').join('');
}

loadCache();
state.settings = normSettings(state.settings);
setSync('local');
render();
initDb();
initAssets();
initDownloads();
})();
</script>
</body>
</html>
